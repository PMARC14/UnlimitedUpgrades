name: Build and Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Mod
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build AllUpgradesMod
        run: dotnet build src/AllUpgradesMod.csproj -c Release

      - name: Create Thunderstore Package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          if ([string]::IsNullOrWhiteSpace($version) -or $version -eq 'main' -or $version -eq 'master') {
            $version = "1.0.0"
          }
          $zipName = "pmadd-Unlimited_Upgrades-$version.zip"
          
          New-Item -ItemType Directory -Path staging -Force | Out-Null
          Copy-Item src/bin/AllUpgradesMod.dll -Destination staging/ -Force
          Copy-Item manifest.json -Destination staging/ -Force
          Copy-Item README.md -Destination staging/ -Force
          Copy-Item icon.png -Destination staging/ -Force
          
          Compress-Archive -Path staging/* -DestinationPath $zipName -Force
          Write-Host "Created release package: $zipName"
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
          draft: false
          prerelease: false
